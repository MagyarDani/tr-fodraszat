<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CUT | Elite Hair Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme Variable */
            --bg: #ffffff;
            --text: #000000;
            --card-bg: #f8f8f8;
            --border: #eeeeee;
            --accent: #444444;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --text: #ffffff;
            --card-bg: #1a1a1a;
            --border: #333333;
            --accent: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); transition: background 0.5s ease, color 0.5s ease; }
        
        /* --- Dark Mode Switch --- */
        .theme-switch {
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            border: 1px solid var(--accent);
            border-radius: 20px;
            width: 50px;
            position: relative;
        }
        .theme-switch::after {
            content: '';
            width: 18px;
            height: 18px;
            background: var(--text);
            border-radius: 50%;
            position: absolute;
            left: 5px;
            transition: 0.3s;
        }
        [data-theme="dark"] .theme-switch::after { left: 25px; }

        /* --- Header Tweak --- */
        header {
            background: var(--bg);
            color: var(--text);
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .nav-controls { display: flex; align-items: center; gap: 20px; }

        /* --- Hero Section --- */
        .hero { height: 70vh; padding: 40px 10%; }
        .hero-banner {
            width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=2070&auto=format&fit=crop') center/cover;
            filter: grayscale(100%);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .hero-banner::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
        .hero-text { position: relative; z-index: 2; color: white; text-align: center; }

        /* --- Services --- */
        .services { padding: 80px 10%; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .s-card { 
            background: var(--card-bg); 
            padding: 40px; 
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .s-card:hover { transform: translateY(-10px); border-color: var(--text); }

        /* --- Modal with Calendar --- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 2000;
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background: var(--bg); color: var(--text);
            padding: 40px; width: 95%; max-width: 500px;
            border: 1px solid var(--border);
        }
        input, select { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: var(--card-bg); color: var(--text); 
            border: 1px solid var(--border); 
        }

        .grid-gallery {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 80px 10%;
        }
        .grid-gallery img { width: 100%; filter: grayscale(100%); transition: 0.5s; cursor: crosshair; }
        .grid-gallery img:hover { filter: grayscale(0%); transform: scale(1.02); }

        .btn-main {
            background: var(--text); color: var(--bg);
            padding: 15px 30px; border: none; font-weight: 700; cursor: pointer;
            transition: var(--transition); width: 100%;
        }
        .btn-main:hover { opacity: 0.8; letter-spacing: 2px; }

        
    </style>
</head>
<body>

    <header>
        <div class="logo">THE CUT</div>
        <div class="nav-controls">
            <div class="theme-switch" onclick="toggleTheme()" title="Sötét/Világos mód"></div>
            <button class="btn-main" style="width: auto; padding: 10px 20px;" onclick="openModal()">FOGLALÁS</button>
        </div>
    </header>

    <section class="hero">
        <div class="hero-banner">
            <div class="hero-text">
                <h1 style="font-size: 3.5rem; font-weight: 900;">NEW STANDARD</h1>
                <p style="letter-spacing: 5px; text-transform: uppercase;">Hair & Beard Studio</p>
            </div>
        </div>
    </section>

    <section class="services">
        <div class="s-card">
            <h3>Classic</h3>
            <p style="margin: 20px 0; opacity: 0.6;">Precíziós hajvágás modern eszközökkel.</p>
            <h2 style="font-weight: 300;">8.500 Ft</h2>
        </div>
        <div class="s-card">
            <h3>The Beard</h3>
            <p style="margin: 20px 0; opacity: 0.6;">Karakteres szakállformázás és ápolás.</p>
            <h2 style="font-weight: 300;">5.500 Ft</h2>
        </div>
        <div class="s-card">
            <h3>Full Service</h3>
            <p style="margin: 20px 0; opacity: 0.6;">A teljes stílusváltás élménye.</p>
            <h2 style="font-weight: 300;">12.500 Ft</h2>
        </div>
    </section>

    <div class="grid-gallery">
        <img src="kepek/kép1.png" alt="Work">
        <img src="kepek/kép2.png" alt="Work">
        <img src="kepek/kép3.png" alt="Work">
    </div>

    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">IDŐPONTFOGLALÁS</h2>
            <label>Válassz szolgáltatást:</label>
            <select>
                <option>Classic Cut</option>
                <option>Beard Grooming</option>
                <option>Full Service</option>
            </select>
            <label>Dátum kiválasztása:</label>
            <input type="date" id="datePicker">
            <label>Időpont:</label>
            <select>
                <option>10:00</option>
                <option>11:30</option>
                <option>14:00</option>
                <option>16:30</option>
            </select>
            <button class="btn-main" onclick="alert('Köszönjük! Hamarosan keresünk.')">FOGLALÁS MEGERŐSÍTÉSE</button>
            <p style="text-align: center; margin-top: 20px; cursor: pointer; font-size: 12px;" onclick="closeModal()">MÉGSE</p>
        </div>
    </div>

    <script>
        // Sötét/Világos mód váltó
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
        }

        // Modal kezelés
        function openModal() { document.getElementById('bookingModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('bookingModal').style.display = 'none'; }

        // Bezárás kattintásra a modal mellé
        window.onclick = function(event) {
            const modal = document.getElementById('bookingModal');
            if (event.target == modal) closeModal();
        }

        // Naptár: Ne lehessen múltbéli dátumot választani
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').setAttribute('min', today);
    </script>
</body>
</html>
