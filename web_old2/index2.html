<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TR Fodrászat Debrecen</title>

<link rel="icon" type="image/png" href="kepek/logo.png">
<link rel="apple-touch-icon" href="kepek/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

/* ===============================
   DYNAMIC VIEWPORT FIX (iOS)
=================================*/
:root {
    --vh: 1vh;
    --bg: #ffffff;
    --text: #000000;
    --card-bg: #f8f8f8;
    --border: #eeeeee;
    --accent: #444444;
    --glass: rgba(255, 255, 255, 0.1);
    --transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
}

[data-theme="dark"] {
    --bg: #0a0a0a;
    --text: #ffffff;
    --card-bg: #141414;
    --border: #222222;
    --accent: #888888;
    --glass: rgba(0, 0, 0, 0.3);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html { scroll-behavior:smooth; }
body {
    background:var(--bg);
    color:var(--text);
    transition:background .5s ease;
    overflow-x:hidden;
}

/* ===============================
   HEADER
=================================*/

header{
    background:var(--bg);
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:10000;
    border-bottom:1px solid var(--border);
    transition:var(--transition);
}

header.scrolled{
    padding:10px 8%;
    background:var(--glass);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
    align-items:center;
}

nav ul li a{
    color:var(--text);
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:.7;
    transition:.3s;
}

nav ul li a:hover{ opacity:1; }

/* ===============================
   HERO
=================================*/

.slider-wrapper{
    position:relative;
    width:100%;
    height:calc(var(--vh)*100);
    overflow:hidden;
    padding:0 8%;
    margin-top:70px;
}

.slide-container{
    display:flex;
    width:300%;
    height:100%;
    transition:transform .8s cubic-bezier(.86,0,.07,1);
}

.slide{
    width:33.333%;
    height:100%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-slide{
    position:relative;
    background:url('kepek/fo_kep.png') center/cover;
    border-radius:4px;
}

.hero-slide::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.6);
    border-radius:4px;
}

.hero-slide>div{
    position:relative;
    z-index:2;
    text-align:center;
    color:#fff;
}

.hero-slide h1{
    font-size:clamp(50px,12vw,130px);
    font-weight:900;
    letter-spacing:-3px;
}

.hero-slide p{
    font-size:14px;
    letter-spacing:8px;
    margin-top:20px;
}

/* ===============================
   MOBILE OPTIMALIZATION
=================================*/

@media (max-width:768px){

.slider-wrapper{
    height:auto;
    overflow:visible;
    padding:0;
}

.slide-container{
    flex-direction:column;
    width:100%;
    transform:none !important;
}

.slide{
    width:100%;
    height:auto;
    padding:40px 20px;
}

.hero-slide{
    height:calc(var(--vh)*80);
}

.slider-nav{ display:none; }

body{ padding-top:70px; }

}

/* ===============================
   LANDSCAPE MOBILE
=================================*/

@media (max-height:500px) and (orientation:landscape){

header{
    height:50px;
    padding:0 15px;
}

nav ul{
    gap:15px;
    overflow-x:auto;
}

.logo{ font-size:12px; }

}

/* ===============================
   MODAL
=================================*/

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(8px);
    z-index:10000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    background:var(--bg);
    width:100%;
    max-width:400px;
    border:1px solid var(--border);
}

@media(max-height:500px){
.modal-content{
    max-height:90vh;
    overflow:auto;
}
}

/* ===============================
   BUTTON TOUCH FIX
=================================*/

button:active,
.nav-arrow:active{
    transform:scale(.95);
}

</style>
</head>

<body>

<header id="mainHeader">
<div class="logo">TR FODRÁSZAT</div>
<nav>
<ul>
<li><a href="#about" onclick="moveSlider(0)">Bemutatkozás</a></li>
<li><a href="#services">Szolgáltatások</a></li>
<li><a href="#gallery">Galéria</a></li>
<li><a href="#location">Helyszín</a></li>
<li><button onclick="openModal()">BEJELENTKEZÉS</button></li>
</ul>
</nav>
</header>

<section id="about" class="slider-wrapper">
<div class="slide-container" id="mainSlider">
<div class="slide hero-slide">
<div>
<h1>PURE<br>PRECISION.</h1>
<p>MINIMALISTA HAJSZOBRÁSZAT</p>
</div>
</div>
</div>
</section>

<div id="bookingModal" class="modal">
<div class="modal-content">
<div style="padding:40px;text-align:center;">
<h2>Időpontfoglalás</h2>
<a href="tel:+36301234567">Hívás: +36 30 123 4567</a>
</div>
</div>
</div>

<script>

/* ===============================
   DYNAMIC VH FIX
=================================*/

function setVH(){
    let vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
}
setVH();
window.addEventListener('resize', setVH);

/* ===============================
   SLIDER
=================================*/

let currentSlide=0;
const totalSlides=1;

function updateSlider(){
if(window.innerWidth<=768) return;
const slider=document.getElementById('mainSlider');
slider.style.transform=`translateX(${currentSlide*-100}%)`;
}

function moveSlider(i){
currentSlide=i;
updateSlider();
}

/* ===============================
   MODAL
=================================*/

function openModal(){
document.getElementById('bookingModal').style.display='flex';
document.body.style.overflow='hidden';
}

window.onclick=function(e){
const modal=document.getElementById('bookingModal');
if(e.target==modal){
modal.style.display='none';
document.body.style.overflow='auto';
}
};

</script>

</body>
</html>
